# Local CPU-only environment (stages 1-2, notebooks): conda env create -f environment.yml, then pip install -e .
# The full pipeline (GPU, captions, search) needs requirements.txt; see README.
name: motion-gating
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy
  # OpenBLAS instead of MKL: on Windows, MKL only loads in an activated env, so Jupyter kernels crashed
  - libblas=*=*openblas
  - pandas
  - matplotlib
  - pillow
  - imageio
  - ffmpeg
  - tqdm
  - pyyaml          # MEVA annotations (rewind/data.py falls back to a line parser without it)
  - ipykernel
  - notebook
  - nbconvert
  - pip
  - pip:
      - opencv-python-headless
      - imagehash
