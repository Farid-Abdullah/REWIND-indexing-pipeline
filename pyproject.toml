# Makes `from rewind import ...` work from any folder (the notebooks live in notebooks/).
# Install once, inside the environment you run in:   pip install -e .
# No dependencies are listed here on purpose, so this never upgrades torch or transformers in a working
# environment. Install those from requirements.txt (or environment.yml for a local CPU-only setup).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "REWIND: natural-language search of recorded CCTV video (motion gating, VLM captions, hybrid retrieval)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["rewind*"]
